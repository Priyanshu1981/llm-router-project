<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign in: Cost-Aware LLM Router</title>
  <style>
    :root { color-scheme: light dark; --bg:#f4f5f8; --panel:#ffffff; --text:#1c2230; --muted:#667085;
            --border:#e2e5eb; --accent:#3b6ef5; --accent-text:#ffffff; --danger:#c7372f; }
    @media (prefers-color-scheme: dark) {
      :root { --bg:#12151c; --panel:#1b202b; --text:#e8ebf2; --muted:#98a2b3;
              --border:#2b3242; --accent:#6c8cff; --accent-text:#0e1220; --danger:#ff7a70; }
    }
    * { box-sizing: border-box; }
    body { margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center; padding:16px;
           font-family: system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
           background:var(--bg); color:var(--text); line-height:1.5; }
    .card { width:100%; max-width:380px; background:var(--panel); border:1px solid var(--border);
            border-radius:14px; padding:26px; box-shadow:0 1px 2px rgba(16,24,40,0.05); }
    h1 { margin:0 0 6px; font-size:1.25rem; }
    p { margin:0 0 16px; color:var(--muted); font-size:0.92rem; }
    label { display:block; font-size:0.85rem; margin-bottom:6px; }
    input { width:100%; font:inherit; color:var(--text); background:var(--bg); border:1px solid var(--border);
            border-radius:10px; padding:10px 12px; }
    input:focus { outline:2px solid var(--accent); outline-offset:-1px; }
    button { width:100%; margin-top:14px; font:inherit; font-weight:600; color:var(--accent-text);
             background:var(--accent); border:0; border-radius:10px; padding:10px 14px; cursor:pointer; }
    button:disabled { opacity:0.6; cursor:progress; }
    .error { min-height:1.3em; margin-top:10px; font-size:0.85rem; color:var(--danger); }
  </style>
</head>
<body>
  <main class="card">
    <h1>Cost-Aware LLM Router</h1>
    <p>This demo is protected to keep its API usage under control. Enter the access code you were given.</p>
    <form id="form">
      <label for="code">Access code</label>
      <input id="code" name="code" type="password" autocomplete="off" autofocus required>
      <button id="btn" type="submit">Continue</button>
      <div class="error" id="message" role="alert"></div>
    </form>
  </main>

  <script>
    (function () {
      var form = document.getElementById("form");
      var input = document.getElementById("code");
      var button = document.getElementById("btn");
      var message = document.getElementById("message");

      form.addEventListener("submit", async function (event) {
        event.preventDefault();
        message.textContent = "";
        button.disabled = true;
        try {
          var response = await fetch("/login", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ code: input.value }),
            credentials: "same-origin"
          });
          if (response.ok) {
            window.location.href = "/";
            return;
          }
          var detail = "Could not sign in.";
          try {
            var body = await response.json();
            if (typeof body.detail === "string") { detail = body.detail; }
          } catch (error) { /* keep the default message */ }
          message.textContent = detail;
        } catch (error) {
          message.textContent = "Could not reach the server.";
        }
        button.disabled = false;
        input.select();
      });
    })();
  </script>
</body>
</html>
